# Render Blueprint: a free static site built from this repo.
services:
  - type: web
    name: fortera
    runtime: static
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    # single-page app: every path such as /app/scan is served by index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
